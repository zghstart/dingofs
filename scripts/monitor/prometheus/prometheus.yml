# my global config
global:
  scrape_interval:     5s # Set the scrape interval to every 15 seconds. Default is every 1 minute.
  evaluation_interval: 15s # Evaluate rules every 15 seconds. The default is every 1 minute.
  # scrape_timeout is set to the global default (10s).

# Alertmanager configuration
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      # - alertmanager:9093

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  - /etc/prometheus/rules/*.yml

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'prometheus'
    # metrics_path defaults to '/metrics'
    # scheme defaults to 'http'.

    static_configs:
    - targets: ['localhost:9090']

  - job_name: 'dingo_metrics'
    metrics_path: '/brpc_metrics'
    file_sd_configs:
    - files: ['/prometheus/targets.json']
      refresh_interval: 15s
    metric_relabel_configs:
    - source_labels: [component, __name__]
      regex: 'mds;dingofs_([0-9]+)_(inode|partition|chunk)_cache_(hit|miss)_count'
      target_label: fs_id
      replacement: '$1'
    - source_labels: [component, __name__]
      regex: 'mds;dingofs_([0-9]+)_(inode|partition|chunk)_cache_(hit|miss)_count'
      target_label: cache
      replacement: '$2'
    - source_labels: [component, __name__]
      regex: 'mds;dingofs_([0-9]+)_(inode|partition|chunk)_cache_(hit|miss)_count'
      target_label: event
      replacement: '$3'

  - job_name: 'dingofs-discovery'
    scrape_interval: 15s
    # This trusted local collector describes other components and target
    # nodes; preserve those explicit resource labels.
    honor_labels: true
    file_sd_configs:
    - files: ['/prometheus/discovery-targets.json']
      refresh_interval: 15s

  - job_name: 'dingofs-node'
    file_sd_configs:
    - files: ['/prometheus/node-targets.json']
      refresh_interval: 15s
